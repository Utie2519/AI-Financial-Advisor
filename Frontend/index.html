<!DOCTYPE html>
<html>
<head>
    <title>AI Finance Home</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .box {
            width: 360px;
            padding: 35px;

            text-align: center;

            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);

            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.15);

            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        h2 {
            margin-bottom: 10px;
            color: #38bdf8;
        }

        p {
            opacity: 0.8;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;

            margin-top: 10px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
            font-weight: bold;

            transition: 0.3s;
        }

        .loginBtn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .registerBtn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
        }

        button:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body>

<div class="box">
    <h2>💰 AI Financial Advisor</h2>

    <p>Smart finance tracking with AI insights</p>

    <button class="loginBtn" onclick="goLogin()">Login</button>
    <button class="registerBtn" onclick="goRegister()">Register</button>
</div>

<script>
function goLogin() {
    window.location.href = "login.html";
}

function goRegister() {
    window.location.href = "register.html";
}
</script>

</body>
</html>
